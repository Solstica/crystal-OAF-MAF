name: literature-reproduction

on:
  push:
    branches: [literature-reproduction]
  pull_request:
    branches: [main]
    paths:
      - "src/pvdf_pf/literature/**"
      - "scripts/reproduce_*.py"
      - "tests/test_guo2024_*.py"
      - "docs/model_notes/*REPRODUCTION*.md"
      - ".github/workflows/literature_reproduction.yml"

jobs:
  guo2024-stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Source-faithful unit tests
        run: pytest -q tests/test_guo2024_landau_axis.py
      - name: Guo 2024 Landau-axis reproduction
        run: python scripts/reproduce_guo2024_landau_axis.py
      - name: Upload reproduction report
        uses: actions/upload-artifact@v4
        with:
          name: guo2024-landau-axis-stage1
          path: outputs/literature_reproduction/guo2024_landau_axis/report.json
          if-no-files-found: error
