name: tests

on:
  push:
    branches: [main, dev-phasefield]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Baseline smoke test
        run: python scripts/run_baseline.py
      - name: v0.1 literature calibration
        run: python scripts/run_v01_calibration.py
      - name: v0.1 morphology and relaxation scan
        run: python scripts/run_v01_morphology_relaxation.py
      - name: v0.1.2 BDS frequency-time bridge
        run: python scripts/run_v012_bds_bridge.py
      - name: v0.1.3 source ingest and OAF subpartition
        run: python scripts/run_v013_source_ingest.py
      - name: v0.1.4 temperature-dependent source state
        run: python scripts/run_v014_temperature_state.py
      - name: v0.1.5 RAF/MAF source consistency audit
        run: python scripts/run_v015_phase_fraction_state.py
      - name: v0.1.6 regularized OAF devitrification
        run: python scripts/run_v016_devitrification_state.py
      - name: v0.1.7 four-component dielectric cell
        run: python scripts/run_v017_four_phase_dielectric.py
      - name: v0.1.8 measured-film closure audit
        run: python scripts/run_v018_source_closure.py
