name: tests

on:
  push:
    branches: [main, dev-phasefield]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Baseline smoke test
        run: python scripts/run_baseline.py
      - name: v0.1 literature calibration
        run: python scripts/run_v01_calibration.py
      - name: v0.1 morphology and relaxation scan
        run: python scripts/run_v01_morphology_relaxation.py
      - name: v0.1.2 BDS frequency-time bridge
        run: python scripts/run_v012_bds_bridge.py
      - name: v0.1.3 source ingest and OAF subpartition
        run: python scripts/run_v013_source_ingest.py
      - name: v0.1.4 temperature-dependent source state
        run: python scripts/run_v014_temperature_state.py
      - name: v0.1.5 RAF/MAF source consistency audit
        run: python scripts/run_v015_phase_fraction_state.py
      - name: v0.1.6 regularized OAF devitrification
        run: python scripts/run_v016_devitrification_state.py
      - name: v0.1.7 four-component dielectric cell
        run: python scripts/run_v017_four_phase_dielectric.py
      - name: v0.1.8 measured-film closure audit
        run: python scripts/run_v018_source_closure.py
      - name: v0.1.9 Rui source-chain reconstruction
        run: python scripts/run_v019_source_reconstruction.py
      - name: v0.1.10 source-state transfer audit
        run: python scripts/run_v0110_source_state_transfer.py
      - name: v0.1.11 closed-OAF transfer compatibility audit
        run: python scripts/run_v0111_oaf_compatibility.py
      - name: v0.1.12 same-state BOPVDF BDS bridge
        run: python scripts/run_v0112_same_state_bds.py
      - name: v0.1.13 same-state full-spectrum BDS calibration
        run: python scripts/run_v0113_full_spectrum.py
      - name: v0.1.14 positive Prony time-domain bridge
        run: python scripts/run_v0114_prony_bridge.py
      - name: v0.1.15 self-consistent local-field coupling
        run: python scripts/run_v0115_ci_diagnostic.py
      - name: v0.1.16 frozen-source orientation audit
        run: python scripts/run_v0116_frozen_source_orientation.py
      - name: v0.1.17 Huang-aligned lamellar waviness sensitivity
        run: python scripts/run_v0117_lamellar_waviness.py
      - name: v0.1.18 Huang-SAXS orientation-constrained scan
        run: python scripts/run_v0118_orientation_constrained_scan.py
      - name: v0.1.19 same-RMS orientation-spectrum sensitivity
        run: python scripts/run_v0119_same_rms_spectrum.py
